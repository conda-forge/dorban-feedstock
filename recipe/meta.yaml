{% set version = "0.1.0" %}

package:
  name: dorban
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/d/dorban/dorban-{{ version }}.tar.gz
  sha256: a80efcd36c1646e410ebe881d3bbc77969db4a93955151f7f04bb692a6e8c5a2

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - setuptools
    - setuptools-scm
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - scipy
    - slepc4py
    - petsc4py
    - matplotlib-base
    - numba
    - multipledispatch
    - more-itertools

test:
  imports:
    - dorban
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://pypi.org/project/dorban/
  summary: A neutron diffusion solver with finite difference and nodal implementations
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - esheder
